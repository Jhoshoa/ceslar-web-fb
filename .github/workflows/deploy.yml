name: Deploy to Firebase

on:
  push:
    branches:
      - release

env:
  NODE_VERSION: '20'

jobs:
  # ==========================================
  # BUILD AND TEST
  # ==========================================
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            functions/package-lock.json
            packages/shared-types/package-lock.json

      # Install dependencies
      - name: Install root dependencies
        run: npm ci

      - name: Install shared-types
        run: npm ci
        working-directory: packages/shared-types

      - name: Build shared-types
        run: npm run build
        working-directory: packages/shared-types

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # Lint
      - name: Lint functions
        run: npm run lint
        working-directory: functions

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      # Build functions
      - name: Build functions
        run: npm run build
        working-directory: functions

      # Build frontend with environment variables
      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_API_URL: https://southamerica-east1-${{ secrets.FIREBASE_PROJECT_ID }}.cloudfunctions.net/api
          VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
          VITE_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET }}
          VITE_USE_EMULATORS: 'false'

      # Upload artifacts for deploy job
      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

      - name: Upload functions build
        uses: actions/upload-artifact@v4
        with:
          name: functions-lib
          path: functions/lib
          retention-days: 1

  # ==========================================
  # DEPLOY TO FIREBASE
  # ==========================================
  deploy:
    name: Deploy to Firebase
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Download build artifacts
      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Download functions build
        uses: actions/download-artifact@v4
        with:
          name: functions-lib
          path: functions/lib

      # Install functions production dependencies (needed for deployment)
      - name: Install functions dependencies
        run: npm ci --omit=dev
        working-directory: functions

      # Create functions .env file for Firebase Functions runtime
      - name: Create functions .env file
        run: |
          cat << EOF > functions/.env
          CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
          EOF

      # Authenticate with Firebase using service account
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Deploy Hosting
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live

      # Deploy Functions
      - name: Deploy Firebase Functions
        run: npx firebase-tools deploy --only functions --project ${{ secrets.FIREBASE_PROJECT_ID }} --force

      # Deploy Firestore Rules
      - name: Deploy Firestore Rules
        run: npx firebase-tools deploy --only firestore:rules --project ${{ secrets.FIREBASE_PROJECT_ID }}

      # Deploy Firestore Indexes
      - name: Deploy Firestore Indexes
        run: npx firebase-tools deploy --only firestore:indexes --project ${{ secrets.FIREBASE_PROJECT_ID }}

      # Deploy Storage Rules
      - name: Deploy Storage Rules
        run: npx firebase-tools deploy --only storage --project ${{ secrets.FIREBASE_PROJECT_ID }}
